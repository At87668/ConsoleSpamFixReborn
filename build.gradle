plugins {
    id 'java'
    id 'eclipse'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group 'link.star_dust'
version '2.0.0'

sourceCompatibility = 17
targetCompatibility = 17

repositories {
    mavenCentral()
    maven {
        name = 'SpigotMC'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    maven {
        name = 'Apache'
        url = 'https://maven.aliyun.com/repository/apache-snapshots'
    }
    maven {
	    name = 'Velocity'
	    url = 'https://repo.papermc.io/repository/maven-public/'
	}
	maven {
        name = 'bStats'
        url = 'https://repo.codemc.org/repository/maven-public/'
    }
	maven {
        name = 'sonatype'
        url = 'https://oss.sonatype.org/content/repositories/snapshots/'
    }
	maven {
	    name = 'md-5'
	    url = 'https://repo.md-5.net/content/repositories/snapshots/'
	}
	maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

// The Forge/NeoForge @Mod annotations are compile-time stubs under
// src/main/stub (see stub/net/...). They are compiled but never shipped.
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'src/main/stub']
        }
    }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.21.4-R0.1-SNAPSHOT'
    compileOnly 'com.velocitypowered:velocity-api:3.0.0-SNAPSHOT'
	compileOnly 'net.md-5:bungeecord-api:1.21-R0.1-SNAPSHOT'
    compileOnly 'org.apache.logging.log4j:log4j-core:2.24.3'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.24.3'
    // Mod platforms: brigadier (standalone lib, not a Minecraft class) for
    // native command registration; fabric-loader-api for name resolution +
    // the ModInitializer entrypoint. Both are provided at runtime by the
    // server / loader and are NOT bundled.
    compileOnly 'com.mojang:brigadier:1.0.18'
    compileOnly 'net.fabricmc:fabric-loader:0.14.22'
    implementation 'org.spongepowered:configurate-yaml:4.1.2'
    implementation 'org.bstats:bstats-bukkit:3.0.0'
    implementation 'org.bstats:bstats-velocity:3.0.0'
    implementation 'org.bstats:bstats-bungeecord:3.0.0'
    //implementation 'net.kyori:adventure-api:4.14.0'
    //implementation 'net.kyori:adventure-text-minimessage:4.14.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    // Expand ${version} in the platform metadata files so the version is
    // kept in sync with the build version automatically.
    filesMatching(['**/plugin.yml', '**/fabric.mod.json', '**/mods.toml', '**/neoforge.mods.toml']) {
        expand(version: project.version.toString())
    }
}

// The plain jar is disabled — distribution is done by the shadowJar task.
// Keeping it would produce a misleading jar and duplicate-entry errors
// (the jar task both copies resources and inlines the compile classpath).
jar {
    enabled = false
}

shadowJar {
    relocate 'org.bstats', 'link.star_dust.bstats'
    // Relocate bundled third-party libs so modded servers (Forge/NeoForge
    // JPMS module layers) never hit split-package errors.
    relocate 'org.spongepowered', 'link.star_dust.spongepowered'
    relocate 'org.yaml', 'link.star_dust.yaml'
    // Compile-time stub annotations (@Mod) are never shipped; the server
    // provides the real net.minecraftforge.* / net.neoforged.* classes.
    exclude 'net/minecraftforge/**'
    exclude 'net/neoforged/**'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveClassifier.set('')
}

build {
    dependsOn shadowJar
}
